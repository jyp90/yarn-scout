# jyp90/yarn-scout(public)의 Pages 배포 워크플로 원본. 여기서는 실행되지 않는다.
# deploy.yml이 dist/.github/workflows/pages.yml로 복사해 dist와 함께 push하고,
# public 리포에서 push된 트리를 그대로 Pages에 올린다(Jekyll 없음, build_type: workflow). docs/deploy.md
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # .git, .github과 점으로 시작하는 파일(.nojekyll)은 빠진다. 데이터 파일 이름은 점으로 시작하지 않는다.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
